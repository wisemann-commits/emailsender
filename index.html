<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Webinar Email Sender</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --text2: #64748b;
      --border: #cbd5e1;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --header-bg: linear-gradient(135deg, #0f172a, #1e40af);
    }
    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --text2: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --header-bg: linear-gradient(135deg, #020617, #1e3a8a);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.5;
      transition: background 0.3s, color 0.3s;
    }
    .container {
      max-width: 840px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .header {
      background: var(--header-bg);
      color: white;
      padding: 24px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 21px; font-weight: 600; }
    .header p { opacity: 0.85; margin-top: 4px; font-size: 13px; }
    .theme-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .content { padding: 28px; }
    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 7px;
    }
    .form-group { margin-bottom: 18px; }
    textarea, input[type="text"], input[type="url"], input[type="file"] {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      background: var(--card);
      color: var(--text);
    }
    textarea:focus, input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    textarea { min-height: 100px; resize: vertical; font-family: inherit; }
    .hint { font-size: 12px; color: var(--text2); margin-top: 5px; }
    .btn-group { display: flex; gap: 12px; margin-top: 6px; }
    .btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn-preview { background: var(--border); color: var(--text); }
    .btn-send { background: var(--primary); color: white; }
    .btn-send:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
    }
    .status.success { background: #dcfce7; color: #166534; display: block; }
    .status.error { background: #fee2e2; color: #991b1b; display: block; }
    .status.info { background: #e0f2fe; color: #075985; display: block; }
    body.dark .status.success { background: #14532d; color: #bbf7d0; }
    body.dark .status.error { background: #7f1d1d; color: #fecaca; }
    body.dark .status.info { background: #0c4a6e; color: #bae6fd; }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card);
      width: 100%;
      max-width: 720px;
      max-height: 90vh;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body { flex: 1; overflow: auto; }
    .modal-body iframe { width: 100%; height: 70vh; border: none; }
    .close-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text2);
    }
    .logo-preview {
      margin-top: 8px;
      max-height: 55px;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Webinar Email Sender</h1>
        <p>Auto Sertifikat + Upload Logo + Simpan Pengaturan</p>
      </div>
      <button class="theme-btn" onclick="toggleTheme()">🌙 / ☀️</button>
    </div>

    <div class="content">
      <div class="form-group">
        <label>Daftar Peserta (Nama|Email)</label>
        <textarea id="participants" placeholder="Budi Santoso|budi@email.com
Siti Nurhaliza|siti@email.com"></textarea>
        <div class="hint">Format: Nama Lengkap|Email</div>
      </div>

      <div class="form-group">
        <label>Subject Email</label>
        <input type="text" id="subject" placeholder="Sertifikat & Rekaman Webinar">
      </div>

      <div class="form-group">
        <label>Nama Pengirim (Display Name)</label>
        <input type="text" id="senderName" value="Panitia Webinar">
      </div>

      <div class="form-group">
        <label>Upload Logo (PNG / JPG)</label>
        <input type="file" id="logoFile" accept="image/png,image/jpeg,image/jpg">
        <img id="logoPreview" class="logo-preview" alt="Preview Logo">
      </div>

      <div class="form-group">
        <label>Folder ID Sertifikat</label>
        <input type="text" id="folderId" placeholder="1aBcDeFgHiJkLmNoPqRsTuVwXyZ">
        <div class="hint">Buka folder di Drive → copy ID setelah /folders/</div>
      </div>

      <div class="form-group">
        <label>Link Rekaman Zoom</label>
        <input type="url" id="zoomLink" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>Link Materi / Dokumen</label>
        <input type="url" id="docLink" placeholder="https://drive.google.com/...">
      </div>

      <div class="form-group">
        <label>Template HTML Email</label>
        <textarea id="htmlBody" style="min-height: 260px; font-family: monospace; font-size: 13px;">
<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:30px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:30px 40px 20px;text-align:center;">
              <img src="{{LOGO}}" alt="Logo" style="max-height:60px;max-width:200px;">
            </td>
          </tr>
          <tr>
            <td style="padding:10px 40px 30px;">
              <h2 style="color:#0f172a;margin:0 0 16px;font-size:22px;">Halo {{Nama}},</h2>
              <p style="color:#334155;font-size:15px;line-height:1.6;margin:0 0 20px;">
                Terima kasih sudah mengikuti webinar kami. Berikut kami kirimkan sertifikat, rekaman, dan materi.
              </p>

              <!-- Tombol Sertifikat -->
              <table width="100%" cellpadding="0" cellspacing="0" id="sertifikat-button" style="margin:16px 0;">
                <tr>
                  <td align="center">
                    <a href="{{SERTIFIKAT}}" style="display:inline-block;background:#059669;color:#ffffff;text-decoration:none;padding:14px 28px;border-radius:8px;font-weight:600;font-size:15px;">
                      Download Sertifikat
                    </a>
                  </td>
                </tr>
              </table>

              <!-- Tombol Zoom -->
              <table width="100%" cellpadding="0" cellspacing="0" id="zoom-button" style="margin:12px 0;">
                <tr>
                  <td align="center">
                    <a href="{{ZOOM_LINK}}" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;padding:14px 28px;border-radius:8px;font-weight:600;font-size:15px;">
                      Tonton Rekaman Zoom
                    </a>
                  </td>
                </tr>
              </table>

              <!-- Materi -->
              <p id="materi-section" style="color:#334155;font-size:15px;line-height:1.6;margin-top:24px;">
                <strong>Materi / Dokumen:</strong><br>
                <a href="{{DOC_LINK}}" style="color:#2563eb;">Download Materi di sini</a>
              </p>

              <p style="color:#64748b;font-size:14px;margin-top:28px;border-top:1px solid #e2e8f0;padding-top:20px;">
                Jika ada pertanyaan, silakan balas email ini.<br><br>
                Salam hangat,<br>
                <strong>Tim Panitia</strong>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
        </textarea>
      </div>

      <div class="btn-group">
        <button class="btn btn-preview" onclick="previewEmail()">Preview Email</button>
        <button class="btn btn-send" id="btnSend" onclick="kirimEmail()">Kirim ke Semua Peserta</button>
      </div>

      <div id="status" class="status"></div>
    </div>
  </div>

  <div class="modal" id="previewModal">
    <div class="modal-content">
      <div class="modal-header">
        <strong>Preview Email</strong>
        <button class="close-btn" onclick="closePreview()">×</button>
      </div>
      <div class="modal-body">
        <iframe id="previewFrame"></iframe>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyiV50Y94wKKl4iFjbjT2I6Dh_Bb4RUUCYaEAeIkwcPgTublhWXiK1PJRg3NM7PzQud/exec";
    const SECRET = "webinar2026";

    // ===== Simpan & Load Pengaturan =====
    const saveFields = ["subject", "senderName", "folderId", "zoomLink", "docLink"];

    function saveSettings() {
      saveFields.forEach(id => {
        localStorage.setItem("wes_" + id, document.getElementById(id).value);
      });
    }

    function loadSettings() {
      saveFields.forEach(id => {
        const val = localStorage.getItem("wes_" + id);
        if (val) document.getElementById(id).value = val;
      });
    }

    // Auto save setiap kali input berubah
    saveFields.forEach(id => {
      document.getElementById(id).addEventListener("change", saveSettings);
      document.getElementById(id).addEventListener("blur", saveSettings);
    });

    // Load saat buka halaman
    loadSettings();

    // Night Mode
    function toggleTheme() {
      document.body.classList.toggle("dark");
      localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    }
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
    }

    // Preview logo
    document.getElementById("logoFile").addEventListener("change", function(e) {
      const file = e.target.files[0];
      const preview = document.getElementById("logoPreview");
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => {
          preview.src = ev.target.result;
          preview.style.display = "block";
        };
        reader.readAsDataURL(file);
      } else {
        preview.style.display = "none";
      }
    });

    function getParticipants() {
      const raw = document.getElementById('participants').value.trim();
      if (!raw) return [];
      return raw.split('\n')
        .filter(l => l.trim())
        .map(line => {
          const parts = line.split('|').map(p => p.trim());
          return { nama: parts[0] || "Peserta", email: parts[1] || "" };
        });
    }

    function getLogoBase64() {
      return new Promise(resolve => {
        const file = document.getElementById("logoFile").files[0];
        if (!file) return resolve({ base64: null, mime: null });
        const reader = new FileReader();
        reader.onload = e => resolve({ base64: e.target.result, mime: file.type });
        reader.readAsDataURL(file);
      });
    }

    async function buildHtml(nama = "Budi Santoso") {
      let html = document.getElementById('htmlBody').value;
      const doc = document.getElementById('docLink').value.trim();
      const zoom = document.getElementById('zoomLink').value.trim();
      const logoData = await getLogoBase64();

      html = html
        .replace(/{{Nama}}/gi, nama)
        .replace(/{{DOC_LINK}}/g, doc || "#")
        .replace(/{{ZOOM_LINK}}/g, zoom || "#")
        .replace(/{{SERTIFIKAT}}/g, "#");

      if (logoData.base64) {
        html = html.replace(/src=["']{{LOGO}}["']/gi, `src="${logoData.base64}"`);
      } else {
        html = html.replace(/<img[^>]*src=["']{{LOGO}}["'][^>]*>/gi, "");
      }

      // Sembunyikan tombol di preview juga
      if (!zoom) html = html.replace(/<table[^>]*id=["']zoom-button["'][\s\S]*?<\/table>/gi, "");
      if (!doc) html = html.replace(/<p[^>]*id=["']materi-section["'][\s\S]*?<\/p>/gi, "");

      return html;
    }

    async function previewEmail() {
      const participants = getParticipants();
      const sampleName = participants.length > 0 ? participants[0].nama : "Budi Santoso";
      const html = await buildHtml(sampleName);
      document.getElementById('previewFrame').srcdoc = html;
      document.getElementById('previewModal').classList.add('active');
    }

    function closePreview() {
      document.getElementById('previewModal').classList.remove('active');
    }

    async function kirimEmail() {
      const participants = getParticipants();
      if (participants.length === 0) {
        showStatus("Isi dulu daftar pesertanya", "error");
        return;
      }

      const subject = document.getElementById('subject').value.trim();
      if (!subject) {
        showStatus("Subject wajib diisi", "error");
        return;
      }

      if (APPS_SCRIPT_URL.includes("PASTE_URL")) {
        showStatus("Belum diisi APPS_SCRIPT_URL", "error");
        return;
      }

      saveSettings(); // pastikan tersimpan

      const btn = document.getElementById('btnSend');
      btn.disabled = true;
      btn.innerText = "Sedang mengirim...";
      showStatus(`Mengirim ke ${participants.length} peserta...`, "info");

      const logoData = await getLogoBase64();

      const payload = {
        secret: SECRET,
        participants,
        subject,
        htmlBody: document.getElementById('htmlBody').value,
        docLink: document.getElementById('docLink').value.trim(),
        zoomLink: document.getElementById('zoomLink').value.trim(),
        folderId: document.getElementById('folderId').value.trim(),
        senderName: document.getElementById('senderName').value.trim() || "Panitia Webinar",
        logoBase64: logoData.base64,
        logoMimeType: logoData.mime
      };

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        btn.disabled = false;
        btn.innerText = "Kirim ke Semua Peserta";

        if (result.message === "Unauthorized") {
          showStatus("Secret key salah", "error");
          return;
        }

        let msg = `Berhasil: ${result.success} | Gagal: ${result.failed}`;
        if (result.errors?.length) {
          msg += "<br><br><b>Detail:</b><br>" + result.errors.join("<br>");
        }
        showStatus(msg, result.failed > 0 ? "error" : "success");

      } catch (err) {
        btn.disabled = false;
        btn.innerText = "Kirim ke Semua Peserta";
        showStatus("Gagal terhubung: " + err.message, "error");
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.innerHTML = msg;
      el.className = "status " + type;
    }

    document.getElementById('previewModal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closePreview();
    });
  </script>
</body>
</html>
